<line x1="225.0" y1="215.0" x2="729.5" y2="215.0" class="centre"/>
<line x1="255.0" y1="170.6" x2="699.5" y2="170.6" class="hidden"/>
<line x1="255.0" y1="259.4" x2="699.5" y2="259.4" class="hidden"/>
<text x="436.7" y="163.6" class="s" text-anchor="middle">bore to suit the work, 1/16 to 5/8 in</text>
<line x1="677.3" y1="115.9" x2="677.3" y2="314.1" class="unkline"/>
<line x1="677.3" y1="115.9" x2="677.3" y2="83.9" class="unk ext"/>

<path d="M717.1,748.9 L766.1,748.9 L766.1,819.0 L656.0,819.0 L656.0,799.0 L717.1,799.0 Z" class="cap"/>
<line x1="436.7" y1="574.1" x2="436.7" y2="477.0" class="meas ext"/>

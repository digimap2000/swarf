<text x="751.5" y="203.0" class="t pub" text-anchor="start">Ø 1.115 in</text>
<text x="751.5" y="219.0" class="s pub" text-anchor="start">(28.32 mm)</text>
<text x="751.5" y="235.0" class="s pub" text-anchor="start">head</text>
<line x1="618.4" y1="131.8" x2="704.4" y2="131.8" class="pub ext"/>
<path d="M692.4,131.8 A74,74 0 0 0 689.8,112.5" class="pub dim"/>
<text x="548.4" y="97.8" class="t pub" text-anchor="end">15° 7′ each side</text>
<line x1="554.4" y1="93.8" x2="690.4" y2="122.8" class="pub ext"/>
<text x="261.0" y="316.2" class="s unk" text-anchor="start">length of this bearing ?</text>
<text x="466.7" y="316.2" class="s unk" text-anchor="start">body thinned and slit here: sizes ?</text>
<text x="30.0" y="432.0" class="h" text-anchor="start">B. In the nose of the headstock: what Andrew measured</text>
<text x="30.0" y="452.0" class="s" text-anchor="start">A section through the closing sleeve and the cap, with the same collet in place. The lever pushes the sleeve to the right.</text>
<path d="M716.0,555.1 L646.7,574.1 L436.7,574.1 L436.7,576.6 L250.5,576.6 L250.5,527.0 L716.0,527.0 Z" class="sleeve"/>
<path d="M716.0,764.9 L646.7,745.9 L436.7,745.9 L436.7,743.4 L250.5,743.4 L250.5,793.0 L716.0,793.0 Z" class="sleeve"/>
<path d="M272.6,576.8 L636.0,576.8 L694.9,560.9 L717.1,560.9 L717.1,759.1 L694.9,759.1 L636.0,743.2 L272.6,743.2 Z" class="part"/>
<line x1="272.6" y1="615.5" x2="717.1" y2="615.5" class="hidden"/>
<line x1="272.6" y1="704.5" x2="717.1" y2="704.5" class="hidden"/>
<line x1="210.5" y1="660.0" x2="826.0" y2="660.0" class="centre"/>

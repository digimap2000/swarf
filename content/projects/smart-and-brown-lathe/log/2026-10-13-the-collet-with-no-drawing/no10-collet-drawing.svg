<polygon points="343.6,743.4 344.5,752.9 338.3,751.4" class="meas head"/>
<text x="314.6" y="843.0" class="t meas" text-anchor="end">Ø 23.84 mm seat</text>
<line x1="541.7" y1="745.9" x2="551.7" y2="839.0" class="meas ext"/>
<polygon points="541.7,745.9 545.8,754.5 539.4,755.2" class="meas head"/>
<text x="556.7" y="843.0" class="t meas" text-anchor="start">Ø 24.55 mm bore</text>
<line x1="716.0" y1="764.9" x2="682.0" y2="869.0" class="meas ext"/>
<polygon points="716.0,764.9 716.2,774.5 710.2,772.5" class="meas head"/>
<text x="677.0" y="873.0" class="t meas" text-anchor="end">Ø 29.97 mm (1.18 in) at the mouth</text>
<line x1="766.1" y1="571.1" x2="806.1" y2="605.1" class="meas ext"/>
<polygon points="766.1,571.1 775.0,574.5 770.9,579.4" class="meas head"/>
<text x="811.1" y="609.1" class="t meas" text-anchor="start">Ø 1.000 in</text>
<text x="811.1" y="625.1" class="s meas" text-anchor="start">hole in the cap</text>
<line x1="716.0" y1="527.0" x2="716.0" y2="506.0" class="meas ext"/>

<text x="711.5" y="109.9" class="s unk" text-anchor="start">not published</text>
<line x1="255.0" y1="314.1" x2="255.0" y2="376.1" class="pub ext"/>
<line x1="699.5" y1="314.1" x2="699.5" y2="376.1" class="pub ext"/>

<text x="203.0" y="203.0" class="t pub" text-anchor="end">Ø 0.936 in</text>
<text x="203.0" y="219.0" class="s pub" text-anchor="end">(23.77 mm)</text>
<text x="203.0" y="235.0" class="s pub" text-anchor="end">back bearing</text>
<line x1="699.5" y1="115.9" x2="747.5" y2="115.9" class="pub ext"/>
<line x1="699.5" y1="314.1" x2="747.5" y2="314.1" class="pub ext"/>

<polygon points="746.0,511.0 737.0,514.2 737.0,507.8" class="meas head"/>
<text x="754.0" y="515.0" class="t meas" text-anchor="start">stroke 0.97 mm</text>
<text x="240.5" y="620.0" class="s unk" text-anchor="end">? depth</text>
<text x="240.5" y="636.0" class="s unk" text-anchor="end">of the seat</text>
<line x1="250.5" y1="576.6" x2="250.5" y2="743.4" class="unkline"/>
<line x1="694.9" y1="560.9" x2="694.9" y2="759.1" class="unkline"/>
<line x1="715.1" y1="752.9" x2="806.1" y2="774.9" class="unk ext"/>
<polygon points="715.1,752.9 724.5,754.4 721.5,760.0" class="unk head"/>
<text x="811.1" y="778.9" class="s unk" text-anchor="start">? how far the cap's seat</text>
<text x="811.1" y="794.9" class="s unk" text-anchor="start">stands off the sleeve's mouth</text>
<text x="811.1" y="834.9" class="s" text-anchor="start">Cap and outside of the</text>
<text x="811.1" y="850.9" class="s" text-anchor="start">sleeve are schematic.</text>
<text x="30.0" y="901.0" class="s" text-anchor="start">From these figures the largest part of the head meets the taper about 3 mm inside the mouth of the sleeve.</text>
<line x1="30.0" y1="916.0" x2="70.0" y2="916.0" class="pub dim"/>
<text x="78.0" y="920.0" class="s pub" text-anchor="start">published by the maker</text>

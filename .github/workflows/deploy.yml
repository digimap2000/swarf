name: Deploy

# Every push to main rebuilds the whole site and replaces what is published.
# Nothing is published that was not built from a commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A second push waits for the first rather than
# cancelling it, so a deploy is never abandoned half way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned, and bumped on purpose. The site is built by a known Hugo, not by
  # whichever was newest on the day. Keep it in step with the Hugo installed
  # locally (hugo version), or a page can build here and not there.
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -sSfLo "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Resizing photos is the only slow part of a build, and a photo that has
      # not changed resizes to the same bytes, so the results are carried from
      # one build to the next.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ github.run_id }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      # baseURL comes from Pages itself, so a custom domain added in the
      # repository settings is picked up with no change here.
      - name: Build
        run: |
          hugo --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

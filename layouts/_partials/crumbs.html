{{- $trail := slice -}}
{{- range .Ancestors.Reverse -}}
  {{- if not (or .IsHome (eq .Path "/projects")) -}}{{- $trail = $trail | append . -}}{{- end -}}
{{- end -}}
{{- with $trail }}
<nav class="crumbs" aria-label="Breadcrumb">
  {{- range $i, $p := . }}
  {{- if $i }}<span aria-hidden="true">/</span>{{ end }}
  <a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a>
  {{- end }}
</nav>
{{- end }}
